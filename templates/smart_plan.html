<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% include 'partials/pwa_head.html' %}
  <title>AttendWise — Today's Plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0d0f14; --surface:#13161d; --surface2:#181c26;
      --border:#1f2330; --border-hi:#2e3347;
      --accent:#4f6ef7; --success:#3ecf8e; --warning:#f5a623; --danger:#f05c5c;
      --text:#e4e6f0; --muted:#6b7191;
      --mono:'JetBrains Mono',monospace; --sans:'Inter',sans-serif;
    }
    html,body { background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; min-height:100vh; }

    nav {
      height:56px; background:var(--surface); border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 28px; position:sticky; top:0; z-index:100; gap:32px;
    }
    .nav-brand { font-family:var(--mono); font-size:13px; font-weight:500; letter-spacing:.1em; color:var(--accent); text-decoration:none; text-transform:uppercase; }
    .nav-links { display:flex; gap:4px; flex:1; }
    .nav-link { padding:6px 14px; border-radius:6px; font-size:13px; font-weight:500; color:var(--muted); text-decoration:none; transition:color .15s,background .15s; }
    .nav-link:hover { color:var(--text); background:var(--border); }
    .nav-link.active { color:var(--accent); background:var(--border); }

    .page { padding:28px; max-width:900px; margin:0 auto; }
    .page-header { margin-bottom:24px; }
    .page-header h1 { font-size:20px; font-weight:700; letter-spacing:-.02em; }
    .page-header p  { font-size:13px; color:var(--muted); margin-top:4px; }

    /* ── Verdict banner ── */
    .verdict-banner {
      border-radius:16px; padding:28px 32px; margin-bottom:24px;
      display:flex; align-items:center; gap:20px; border:1px solid var(--border);
    }
    .verdict-icon { font-size:36px; flex-shrink:0; }
    .verdict-text h2 { font-size:20px; font-weight:700; letter-spacing:-.01em; margin-bottom:4px; }
    .verdict-text p  { font-size:13px; color:var(--muted); }

    .verdict-banner.safe     { background:rgba(62,207,142,.08);  border-color:rgba(62,207,142,.3); }
    .verdict-banner.risky    { background:rgba(245,166,35,.08);  border-color:rgba(245,166,35,.3); }
    .verdict-banner.notsafe  { background:rgba(240,92,92,.08);   border-color:rgba(240,92,92,.3); }
    .verdict-banner.none     { background:var(--surface); }

    .verdict-banner.safe    .verdict-text h2 { color:var(--success); }
    .verdict-banner.risky   .verdict-text h2 { color:var(--warning); }
    .verdict-banner.notsafe .verdict-text h2 { color:var(--danger); }

    /* ── Timeline ── */
    .timeline { position:relative; padding-left:24px; }
    .timeline::before {
      content:''; position:absolute; left:5px; top:8px; bottom:8px; width:2px; background:var(--border);
    }

    .class-item { position:relative; margin-bottom:16px; }
    .class-dot {
      position:absolute; left:-24px; top:18px; width:12px; height:12px;
      border-radius:50%; border:2px solid var(--bg);
    }
    .class-dot.must  { background:var(--danger); }
    .class-dot.risky { background:var(--warning); }
    .class-dot.safe  { background:var(--success); }

    .class-card {
      background:var(--surface); border:1px solid var(--border); border-radius:12px;
      padding:18px 20px; transition:border-color .15s;
    }
    .class-card:hover { border-color:var(--border-hi); }

    .class-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:12px; }
    .class-time { font-family:var(--mono); font-size:12px; color:var(--muted); margin-bottom:6px; }
    .class-subject { font-size:14.5px; font-weight:600; letter-spacing:-.01em; }
    .class-meta { font-size:12px; color:var(--muted); margin-top:4px; }

    .verdict-pill {
      font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
      padding:5px 12px; border-radius:20px; white-space:nowrap; flex-shrink:0;
    }
    .verdict-pill.must  { background:rgba(240,92,92,.15);  color:var(--danger); }
    .verdict-pill.risky { background:rgba(245,166,35,.15); color:var(--warning); }
    .verdict-pill.safe  { background:rgba(62,207,142,.15); color:var(--success); }

    .class-bottom {
      display:flex; justify-content:space-between; align-items:center;
      padding-top:12px; border-top:1px solid var(--border); font-size:12px;
    }
    .class-pct { font-family:var(--mono); font-weight:600; }
    .class-budget { color:var(--muted); }

    /* Empty */
    .empty-state {
      text-align:center; padding:60px 24px; color:var(--muted);
      background:var(--surface); border:1px solid var(--border); border-radius:16px;
    }
    .empty-state .icon { font-size:36px; margin-bottom:14px; }

    @media (max-width:600px) {
      .page { padding:16px; }
      .verdict-banner { padding:20px; }
    }
  </style>
</head>
<body>

{% set page = 'smart-plan' %}
{% include 'partials/nav.html' %}

<div class="page">
  <div class="page-header">
    <h1>Today's Smart Bunk Plan</h1>
    <p id="dateLabel">Loading today's schedule…</p>
  </div>

  <div id="verdictBanner"></div>
  <div class="timeline" id="timeline"></div>
</div>

<script>
const VERDICT_META = {
  'SAFE':      { icon:'✓', cls:'safe',    title:"You're good today",     desc:'Most of today\'s classes are safely bunkable.' },
  'RISKY':     { icon:'⚠', cls:'risky',   title:'Proceed with caution',  desc:'Some classes today need attention.' },
  'NOT SAFE':  { icon:'✗', cls:'notsafe', title:'Attend today',          desc:'Today has classes you really shouldn\'t skip.' },
  'NO CLASSES':{ icon:'☕', cls:'none',    title:'No classes today',      desc:'Enjoy your day off.' },
};

const dayFull = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday', Sat:'Saturday', Sun:'Sunday' };

fetch('/api/smart-plan')
  .then(r => r.json())
  .then(d => render(d))
  .catch(() => {
    document.getElementById('timeline').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div>Failed to load today\'s plan.</div>';
  });

function statusClass(s) {
  if (s === 'MUST ATTEND') return 'must';
  if (s === 'RISKY')       return 'risky';
  return 'safe';
}

function render(d) {
  const today = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  document.getElementById('dateLabel').textContent = today;

  const v = d.daily_verdict;
  const meta = VERDICT_META[v.status] || VERDICT_META['RISKY'];

  document.getElementById('verdictBanner').innerHTML = `
    <div class="verdict-banner ${meta.cls}">
      <div class="verdict-icon">${meta.icon}</div>
      <div class="verdict-text">
        <h2>${meta.title}</h2>
        <p>${v.reason || meta.desc}</p>
      </div>
    </div>`;

  if (!d.classes.length) {
    document.getElementById('timeline').innerHTML =
      '<div class="empty-state"><div class="icon">☕</div>No classes scheduled today.</div>';
    return;
  }

  document.getElementById('timeline').innerHTML = d.classes.map(c => {
    const cls = statusClass(c.status);
    return `
      <div class="class-item">
        <div class="class-dot ${cls}"></div>
        <div class="class-card">
          <div class="class-top">
            <div>
              <div class="class-time">${c.time}</div>
              <div class="class-subject">${c.subject}</div>
              <div class="class-meta">${c.faculty || ''} ${c.room ? '· ' + c.room : ''}</div>
            </div>
            <span class="verdict-pill ${cls}">${c.status}</span>
          </div>
          <div class="class-bottom">
            <span class="class-pct" style="color:${c.percent >= 80 ? 'var(--success)' : c.percent >= 75 ? 'var(--warning)' : 'var(--danger)'}">${c.percent}%</span>
            <span class="class-budget">${c.bunk_budget > 0 ? c.bunk_budget + ' bunk budget left' : 'no budget left'}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}
</script>
{% include 'partials/pwa_sw.html' %}
</body>
</html>
