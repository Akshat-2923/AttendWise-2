<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  {% include 'partials/pwa_head.html' %}
  <title>AttendWise — Timetable</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #13161d;
      --surface2:  #181c26;
      --border:    #1f2330;
      --border-hi: #2e3347;
      --accent:    #4f6ef7;
      --accent-hi: #6b85ff;
      --success:   #3ecf8e;
      --warning:   #f5a623;
      --danger:    #f05c5c;
      --text:      #e4e6f0;
      --muted:     #6b7191;
      --mono:      'JetBrains Mono', monospace;
      --sans:      'Inter', sans-serif;
      --nav-h:     56px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Nav (same as dashboard) ── */
    nav {
      height: var(--nav-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 32px;
    }

    .nav-brand {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .1em;
      color: var(--accent);
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav-links { display: flex; gap: 4px; flex: 1; }

    .nav-link {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color .15s, background .15s;
    }

    .nav-link:hover, .nav-link.active { color: var(--text); background: var(--border); }
    .nav-link.active { color: var(--accent); }

    /* ── Page ── */
    .page { padding: 28px; max-width: 1200px; margin: 0 auto; }

    .page-header { margin-bottom: 24px; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .page-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .page-header p  { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* ── Day tabs ── */
    .day-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .day-tab {
      padding: 7px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }

    .day-tab:hover { border-color: var(--border-hi); color: var(--text); }

    .day-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .day-tab.today::after {
      content: '';
      position: absolute;
      top: 5px;
      right: 5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
    }

    .day-tab.active.today::after { background: #fff; }

    /* ── Slot cards ── */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .slot-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      position: relative;
      transition: border-color .15s;
    }

    .slot-card:hover { border-color: var(--border-hi); }

    .slot-card.lecture  { border-left: 3px solid var(--accent); }
    .slot-card.practical { border-left: 3px solid var(--success); }
    .slot-card.tutorial { border-left: 3px solid var(--warning); }


    .slot-time {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: .04em;
    }

    .slot-subject {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.01em;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .slot-code {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .slot-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .slot-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .slot-meta-row svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      opacity: .5;
    }

    .type-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .type-badge.L { background: rgba(79,110,247,.15); color: var(--accent); }
    .type-badge.P { background: rgba(62,207,142,.15); color: var(--success); }
    .type-badge.T { background: rgba(245,166,35,.15); color: var(--warning); }

    /* ── Empty state ── */
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .empty-state .icon { font-size: 32px; margin-bottom: 12px; }

    /* ── Weekly summary strip ── */
    .week-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .week-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s;
    }

    .week-cell:hover { border-color: var(--border-hi); }
    .week-cell.active { border-color: var(--accent); }
    .week-cell.today-cell { border-color: var(--success); }

    .week-cell-day {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .week-cell.today-cell .week-cell-day { color: var(--success); }

    .week-cell-count {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .week-cell-label {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    @media (max-width: 600px) {
      .week-strip { grid-template-columns: repeat(3, 1fr); }
      .slots-grid { grid-template-columns: 1fr; }
      .page { padding: 16px; }
    }
  </style>
</head>
<body>

{% set page = 'timetable' %}
{% include 'partials/nav.html' %}

<div class="page">

  <div class="page-header">
    <div>
      <h1>My Timetable</h1>
      <p id="pageSubtitle">Loading schedule…</p>
    </div>
  </div>

  <!-- Weekly summary strip -->
  <div class="week-strip" id="weekStrip"></div>

  <!-- Day tabs -->
  <div class="day-tabs" id="dayTabs"></div>

  <!-- Slots -->
  <div class="slots-grid" id="slotsGrid">
    <div class="empty-state"><div class="icon">⏳</div>Fetching timetable…</div>
  </div>

</div>

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday', Sat:'Saturday', Sun:'Sunday' };

const todayIdx = new Date().getDay(); // 0=Sun
const dayMap = { 1:'Mon', 2:'Tue', 3:'Wed', 4:'Thu', 5:'Fri', 6:'Sat', 0:'Sun' };
const todayKey = dayMap[todayIdx];

let activeDay = DAYS.includes(todayKey) ? todayKey : 'Mon';
let timetableData = {};

function renderWeekStrip(data) {
  const strip = document.getElementById('weekStrip');
  strip.innerHTML = DAYS.map(day => {
    const slots = (data[day] || []);
    const isToday = day === todayKey;
    const isActive = day === activeDay;
    return `
      <div class="week-cell ${isToday ? 'today-cell' : ''} ${isActive ? 'active' : ''}"
           onclick="switchDay('${day}')">
        <div class="week-cell-day">${day}${isToday ? ' ·' : ''}</div>
        <div class="week-cell-count">${slots.length}</div>
        <div class="week-cell-label">${slots.length === 1 ? 'class' : 'classes'}</div>
      </div>`;
  }).join('');
}

function renderTabs() {
  const tabs = document.getElementById('dayTabs');
  tabs.innerHTML = DAYS.map(day => `
    <button class="day-tab ${day === activeDay ? 'active' : ''} ${day === todayKey ? 'today' : ''}"
            onclick="switchDay('${day}')">
      ${DAY_FULL[day]}
    </button>`).join('');
}

function renderSlots(data) {
  const grid = document.getElementById('slotsGrid');
  const slots = data[activeDay] || [];

  if (!slots.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">☕</div>No classes on ${DAY_FULL[activeDay]}</div>`;
    return;
  }

  // Sort by time
  const sorted = [...slots].sort((a, b) => {
    const toMin = t => {
      const m = t.match(/(\d+):(\d+)/);
      if (!m) return 0;
      let h = parseInt(m[1], 10), min = parseInt(m[2], 10);
      // Heuristic: hours 1-7 are PM (13-19), hours 8-12 are AM/noon (8-12).
      if (h < 8) h += 12;
      return h * 60 + min;
    };
    return toMin(a.time) - toMin(b.time);
  });

function typeLabel(t) {
  if (t === 'L') return 'Lecture';
  if (t === 'P') return 'Practical';
  if (t === 'T') return 'Tutorial';
  return t || '—';
}

function typeClass(t) {
  if (t === 'L') return 'lecture';
  if (t === 'P') return 'practical';
  if (t === 'T') return 'tutorial';
  return 'lecture';
}

grid.innerHTML = sorted.map(slot => `
  <div class="slot-card ${typeClass(slot.type)}">
    <span class="type-badge ${slot.type || ''}">${typeLabel(slot.type)}</span>
    <div class="slot-time">${slot.time || '—'}</div>
    <div class="slot-subject">${slot.subject_name || slot.subject_code || '—'}</div>
    <div class="slot-code">${slot.subject_code || '—'}</div>
    <div class="slot-meta">
      <div class="slot-meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        ${slot.faculty || '—'}
      </div>
      <div class="slot-meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ${slot.room || '—'}
      </div>
      <div class="slot-meta-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></svg>
        ${slot.group || '—'}
      </div>
    </div>
  </div>`).join('');
}

function switchDay(day) {
  activeDay = day;
  renderTabs();
  renderWeekStrip(timetableData);
  renderSlots(timetableData);
}

fetch('/api/timetable')
  .then(r => r.json())
  .then(data => {
    timetableData = data;
    const totalSlots = DAYS.reduce((n, d) => n + (data[d] || []).length, 0);
    document.getElementById('pageSubtitle').textContent =
      `${totalSlots} classes this week · Today is ${DAY_FULL[todayKey] || 'Weekend'}`;
    renderWeekStrip(data);
    renderTabs();
    renderSlots(data);
  })
  .catch(() => {
    document.getElementById('slotsGrid').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div>Failed to load timetable. Try refreshing.</div>';
  });
</script>
{% include 'partials/pwa_sw.html' %}
</body>
</html>
